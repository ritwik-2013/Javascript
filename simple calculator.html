<!DOCTYPE html>
<html>
    <body>
        <h1>Maths operations using 8,9</h1>
        <br>
        <h1>Addition</h1>
        <p id="add"> </p>
        <h1>Subtraction</h1>
        <p id="Sub"></p>
        <h1>Multiplication</h1>
        <p id="mul"></p>
        <h1>Division</h1>
        <p id="div"></p>

        <script>
            var x = 8; 
            var y = 9;
            var z = x + y;
            var s = x - y;
            var m = x*y;
            var d = x/y

            document.getElementById("add").innerHTML ="The value of 8+9 is " +z
            document.getElementById("Sub").innerHTML ="The value of 8-9 is " +s

            document.getElementById("mul").innerHTML ="The value of 8*9 is " +m

            document.getElementById("div").innerHTML ="The value of  8/9 is " +d
        </script>
    </body>
</html>
