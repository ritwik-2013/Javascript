<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript for loop</h2>
        <p id="Demo"></p>
    </body>
    <script>
        var fruits = ["Banana", "orange", "Mango", "Apple"];
        var text = "";
        var i;
        for (i=0; i < fruits.length; i++) {
            text+= fruits[i] + "<br>";
        }
        document.getElementById("Demo").innerHTML= text;
    </script>
</html>
